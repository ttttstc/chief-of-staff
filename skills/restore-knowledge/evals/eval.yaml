schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include: [SKILL.md, "references/**", "agents/openai.yaml"]

engine:
  name: codex

cases:
  files:
    - evals/cases/knowledge-not-decision.yaml
    - evals/cases/no-knowledge-inflation.yaml
    - evals/cases/source-and-uncertainty.yaml
    - evals/cases/self-contained-wiki.yaml
    - evals/cases/missing-conversation.yaml
    - evals/cases/personalized-learning-resources.yaml
    - evals/cases/offline-resource-boundary.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 5
  parallelism: 2

report:
  formats: [json, html]
