id: judgment-not-task-log
title: 归档判断理由但排除任务流水
description: 验证技能记录选择及其推理，不把负责人和日期写成知识资产。

input:
  prompt: |
    请使用 restore-knowledge 归档这段讨论：
    我们比较了直接全面迁移与分阶段迁移。分阶段迁移通过限制单次变更范围降低不可逆故障的影响半径，但会增加过渡期双轨维护成本。因为回滚代价高且系统边界可切分，我最终选择分阶段迁移；如果双轨维护成本超过团队容量，我会重新考虑。计划下周一开始，并让小王负责第一阶段。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "记录用户选择分阶段迁移，并保留全面迁移这一替代方案"
    - "记录影响半径、双轨维护成本、系统可切分和反转条件等判断理由"
    - "不把下周一执行或小王负责写成知识资产"
    - "把用户判断与经过验证的事实明确区分"
  pass_threshold: 0.9
