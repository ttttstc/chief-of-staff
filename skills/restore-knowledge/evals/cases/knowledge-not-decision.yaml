id: knowledge-not-decision
title: 从方案讨论中提炼知识但排除决策
description: 验证技能保留可迁移原理，不记录用户最终选择和行动安排。

input:
  prompt: |
    请使用 restore-knowledge 归档这段讨论：
    我们比较了直接全面迁移与分阶段迁移。分阶段迁移通过限制单次变更范围降低不可逆故障的影响半径，但会增加过渡期双轨维护成本；当回滚代价高、系统边界可切分时更有价值。最后我决定下周一采用分阶段迁移，并让小王负责第一阶段。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "归档分阶段迁移降低影响半径的机制、适用条件和双轨维护代价"
    - "不记录下周一执行、用户最终选择或小王负责等决策与行动安排"
    - "输出为自包含的中文 Markdown 知识文档，而非聊天摘要"
  pass_threshold: 0.85
