id: personalized-learning-resources
title: 学习资源紧扣当前认知缺口
description: 验证 Wiki 后的资源清单不是通用热门书单，并说明独特视角和当前关联。

input:
  prompt: |
    请使用 restore-knowledge 归档本次讨论。新增知识是：双向钢人要求分别构造支持和反对当前倾向的最强论证，它不是机械折中；我尤其意识到自己过去经常只寻找支持材料，却不知道如何识别真正能推翻判断的证据。我想继续深入这个方向。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "在 Wiki 正文后给出进一步学习方向和三到五项关键资源"
    - "资源聚焦反证、证伪、确认偏误、论证或对抗性协作等当前认知缺口，不是泛化自我提升书单"
    - "逐项说明独特视角、与当前主题的关联和可执行的切入建议"
    - "资源之间具有互补性，没有用同类重复项目机械凑数"
    - "不把用户的兴趣表达写成已经掌握或能力已经提升的事实"
  pass_threshold: 0.85
