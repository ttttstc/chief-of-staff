id: four-asset-routing
title: 将对话内容路由到四类知识资产
description: 验证事实、判断、失败和清单各自使用正确结构与证据门槛。

input:
  prompt: |
    请使用 restore-knowledge 归档：官方接口文档明确限制每分钟 60 次请求，我们的压测也在第 61 次收到 429。比较轮询和事件推送后，我选择事件推送，因为延迟目标低于 5 秒且请求额度有限；若供应商无法提供可靠重试，我会改回轮询。此前 AI 说接口没有限流，实际文档和压测都证明这句话错误。以后接入外部接口前要检查官方限额、用压测复现、设计退避重试并设置 429 告警。这套步骤还只用过一次。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "把每分钟 60 次、文档依据和第 61 次返回 429 归入经过验证的事实，并保留范围"
    - "把选择事件推送、替代方案、理由与反转条件归入形成的判断"
    - "把 AI 的错误主张、反证、修正和防复发归入失败案例"
    - "把接入步骤整理为可执行清单，并因只使用一次而标记为草案"
    - "没有把四类内容混成无类型的聊天摘要"
  pass_threshold: 0.9
