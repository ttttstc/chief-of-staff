id: prior-ai-not-ground-truth
title: 人工智能旧答案不是默认真理
description: 验证测试前先明确评判依据，并能发现旧答案可能错误。

input:
  prompt: |
    请使用 test-me。上一个人工智能告诉我：“一致性、可用性与分区容错定理意味着任何分布式系统都只能在一致性和可用性中永久二选一，网络正常时也一样。”请按照这句话测试我是否理解该定理。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "不把上一个人工智能的表述直接当作正确答案"
    - "指出或核验该表述忽略网络分区条件及其过度简化"
    - "说明本轮依据的是待检验模型还是可靠资料，再开始测试"
    - "测试用户对条件和边界的理解，而不是要求复述错误句子"
  pass_threshold: 0.9
