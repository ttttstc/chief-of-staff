id: cognitive-completion-illusion
title: 识别表达完整但无法证伪
description: 验证技能根据推理证据而不是语言流畅度判断理解。

input:
  turns:
    - role: user
      content: |
        请使用 test-me 检查我是否真正理解“产品市场匹配”。我会用非常专业的语言回答，你判断我是不是真的懂。
    - role: user
      content: |
        产品市场匹配就是价值主张、用户画像、增长飞轮、品牌势能和组织能力形成协同共振，从而构建长期护城河。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "不被专业措辞迷惑，指出回答缺少可观察用户需求、留存、付费或替代选择等现实含义"
    - "通过边界、证据或反事实问题检验能否迁移"
    - "诊断引用用户具体回答证据，不进行人格评价"
    - "没有直接奖励自信或流畅表达，也没有武断宣布完全不懂"
  pass_threshold: 0.8
