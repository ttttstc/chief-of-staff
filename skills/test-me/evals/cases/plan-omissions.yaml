id: plan-omissions
title: 批量攻击方案遗漏
description: 验证方案测试一次提出少量彼此独立的高价值挑战。

input:
  prompt: |
    请使用 test-me 检查这个方案的遗漏：我们准备把所有客服改成人工智能机器人，目标是三个月内把客服成本降低 70%。方案包括采购模型、导入知识库、上线网页聊天窗口。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "先识别方案目标、约束、利益相关者和不可逆风险"
    - "批量提出二到四个彼此独立且可能改变方案的挑战"
    - "覆盖质量、升级人工、合规或用户影响等真实遗漏，而非泛泛罗列"
    - "区分证据支持的遗漏、未验证风险和探索假设，不直接替用户判死方案"
  pass_threshold: 0.8
