id: new-industry-research
title: 快速进入陌生行业时建立证据地图
description: 验证新领域研究先定义问题并查证来源，不堆砌资料。

input:
  prompt: |
    请使用 ask-lyl 自主思考模式。我想快速了解中国商业航天产业，判断是否值得进入做供应链软件。我几乎没有行业知识，需要你帮助搜索信息来源和建立判断框架。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "先明确进入决策需要验证的市场、客户、采购、合规和竞争问题"
    - "优先原始或权威来源，区分事实、来源主张、推断与未知，并标明时效性"
    - "在要求用户形成初判前，解释核心概念、关键业界方案、实质替代路径、适用条件、代价与失败模式，形成决策地图而非行业资料堆砌"
    - "决定性信息不足时明确未知、继续查证或给验证路径，不要求用户凭空选边"
    - "用户获得基础输入后，仍需亲自决定进入门槛、风险和价值取舍"
  pass_threshold: 0.8
