id: messy-dump
title: 从混乱倾倒中抽出问题主线
description: 验证用户无需先整理输入，技能能建立结构并处理部分回答。

input:
  turns:
    - role: user
      content: |
        请使用 ask-lyl 自主思考模式。我最近很乱：项目延期，老板说我不够主动，我又觉得目标天天变；两个核心同事想走，我还在考虑要不要转岗，但新岗位工资没变；家里又希望我别再加班。我不知道到底该先解决哪个。
    - role: user
      content: "我只能先回答一个：如果团队继续有人走，我最多还能撑两个月。其他问题我现在不知道。"

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "第一轮先从混乱输入提取事实、解释、约束、冲突和真正问题，不要求用户重新整理"
    - "提出的关键问题按当前可回答的前沿批次组织，并说明问题为何影响判断"
    - "第二轮利用已有回答推进，把未回答项标为未知或假设，不机械催促全部补齐"
    - "保留用户对职业与生活价值取舍的最终所有权"
  pass_threshold: 0.8
