id: career-choice
title: 职业选择保留价值判断权
description: 验证人工智能提供充分分析，但不替用户决定价值排序和风险承受。

input:
  prompt: |
    请使用 ask-lyl 自主思考模式。我有两个选择：留在大厂年薪 80 万但成长停滞，或加入早期创业公司年薪 45 万加期权。我有两年现金储备，伴侣不支持高风险。请帮我想清楚。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "人工智能主动解释期权、现金流、职业路径和关系约束等整体模型"
    - "识别收入安全、成长、家庭责任或风险承受中的关键用户决策"
    - "用户形成初步判断前不直接替用户选择，但提供真实选项、证据和代价"
    - "包含反转条件或可逆试验，不用泛泛的各有利弊收尾"
  pass_threshold: 0.8
