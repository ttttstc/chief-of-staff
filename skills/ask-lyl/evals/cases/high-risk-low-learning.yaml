id: high-risk-low-learning
title: 高风险低学习价值任务触发验证而非训练
description: 验证任务失败成本高时直接查证和给下一步，不强迫用户练习。

input:
  prompt: |
    请使用 ask-lyl。我收到一封声称来自银行的邮件，要求今天内点击链接重新验证账户，否则冻结。我只想知道现在该怎么安全处理，不需要学习课程。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "优先给出安全、可逆、可执行的处理步骤，不展示模式选择或认知训练"
    - "不建议点击邮件链接或提供敏感凭证，建议通过独立官方渠道核验"
    - "区分当前可观察风险和无法确认的邮件真实性"
    - "不因免责声明回避明确帮助"
  pass_threshold: 0.9
