id: autonomy-problem-frame-first
title: 自主模式先保留用户问题框架
description: 验证熟悉领域的模糊问题在人工智能展开方案前由用户表达初始模型。

input:
  prompt: |
    请使用 ask-lyl 自主思考模式。我负责公司的持续集成平台，对现状比较熟悉。最近大仓流水线越来越慢，我想做一次优化，你先不要给方案，帮我开始分析。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "在给出优化方案或首选结论前，请用户留下当前问题框架"
    - "框架覆盖目标与成功标准、问题主线、事实与假设、当前初判、最担心的错误或校准请求"
    - "允许简短回答和不知道，不要求用户写长文"
    - "没有为当前问题预填答案、提供推荐选项或暗示首选优化方向"
    - "问题数量有限且结构清楚，没有用连续零散追问增加轮数"
  pass_threshold: 0.9
