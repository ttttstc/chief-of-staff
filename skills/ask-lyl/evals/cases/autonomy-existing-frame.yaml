id: autonomy-existing-frame
title: 已有完整框架时不重复填表
description: 验证技能保留用户原始认知并只补决定性缺口。

input:
  prompt: |
    请使用 ask-lyl 自主思考模式分析。目标是把大仓流水线 P95 等待时间从 18 分钟降到 8 分钟。监控显示高峰期执行器利用率 95%，重复构建占任务量约 30%；“缓存命中率足够高”目前只是我的假设。我倾向先试构建缓存，因为改动可逆，但担心真正瓶颈是资源调度；如果压测显示缓存只能改善不到 10%，我会转向调度。请重点检查我是否漏了决定变量和替代路径。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "识别用户已经提供目标、问题模型、事实与假设、初判、担忧和反转条件"
    - "不要求用户重新填写完整问题框架或机械复述原文"
    - "保留用户原始判断痕迹，只补充会实质改变分析的证据或结构缺口"
    - "没有把人工智能重写后的问题模型冒充用户自己的表达"
  pass_threshold: 0.9
