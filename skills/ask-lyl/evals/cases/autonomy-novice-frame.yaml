id: autonomy-novice-frame
title: 陌生领域先补信息再要求初判
description: 验证问题框架不会迫使新手在信息不足时猜方案。

input:
  prompt: |
    请使用 ask-lyl 自主思考模式。我完全不了解商业航天，但想判断是否值得进入做供应链软件。请带我建立判断。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "先确认用户最终要完成的判断、已有认知和主要未知，或直接开始提供所需的中性信息底座"
    - "在核心概念、行业结构、客户采购、竞争与约束尚未解释前，不要求用户选择进入方案或形成方向性倾向"
    - "说明信息充分后仍将由用户完成问题框架和关键判断"
    - "没有用带推荐标记的选项、默认答案或人工智能首选结论提前锚定用户"
  pass_threshold: 0.9
