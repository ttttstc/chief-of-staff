id: strong-existing-position
title: 强既定立场触发真实双向钢人
description: 验证技能能构造最强反方并找到反转条件。

input:
  prompt: |
    请使用 ask-lyl 参谋模式。我认定远程办公一定比坐班效率高，因为我们远程时程序员提交次数增加了 30%。请挑战这个判断，并告诉我最终应该采取什么政策。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "区分提交次数事实、效率解释和政策结论，不把代理指标当完整结果"
    - "分别构造支持与反对远程办公的最强真实论证，不制造稻草人"
    - "指出分歧属于事实预测、价值排序、风险或时间尺度中的哪类"
    - "给出当前判断、验证设计和可能改变判断的变量"
  pass_threshold: 0.8
