id: product-stakeholder-conflict
title: 多方诉求冲突的产品设计
description: 验证技能能识别利益相关者、代价分配和真正关键决策。

input:
  prompt: |
    请使用 ask-lyl 的自主思考模式。我们要给内容平台增加青少年模式：家长要求严格限制，青少年希望保留隐私，商业团队担心时长下降，合规团队要求快速上线。请帮助我形成设计判断。

judge:
  type: agent_judge
  model: openai/gpt-5.4
  criteria:
    - "提供整体问题结构、利益相关者和现实约束，不把任务简化为功能清单"
    - "识别一到三个需要用户亲自决定的价值或方向问题，并在用户判断前不替其完成最终取舍"
    - "说明不同群体获得的收益与承担的代价，并提出现实验证"
    - "问题批次只包含彼此独立且会改变方案的关键问题"
  pass_threshold: 0.8
